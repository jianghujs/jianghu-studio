<script type="text/x-template" id="vueJsonEditor">
  <div>
    <div v-if="showBtns !== false" class="pb-2 d-flex justify-space-between align-center">
      <div class="json-title">{{title}}</div>
      <v-btn small depressed color="success" @click="onSave" :disabled="error">{{ locale[lang].save }}</v-btn>
    </div>
    <div class="jsoneditor-vue" :style="{height}" :class="{'jsoneditor-vue-min': type === 'resource'}"></div>
  </div>
</script>

<script>
  Vue.component("vueJsonEditor", {
    template: "#vueJsonEditor",
    props: {
      value: [String, Number, Object, Array],
      showBtns: [Boolean],
      expandedOnStart: {
        type: Boolean,
        default: false
      },
      mode: {
        type: String,
        default: "tree"
      },
      modes: {
        type: Array,
        default: function () {
          return ["tree", "code", "form", "text", "view"];
        }
      },
      lang: {
        type: String,
        default: "en"
      },
      title: {
        type: String,
        default: ''
      },
      type: {
        type: String,
        default: 'ui'
      },
      // Add the totalHeight prop
      height: {
        type: String,
        default: 'calc(100vh - 240px)'
      },
    },
    watch: {
      value: {
        immediate: true,
        async handler(val) {
          if (!this.internalChange) {
            await this.setEditor(val);

            this.error = false;
            this.expandAll();
          }
        },
        deep: true
      }
    },
    data() {
      return {
        editor: null,
        error: false,
        internalChange: false,
        expandedModes: ["tree", "view", "form"],
        locale: {
          it: {
            save: "SALVA"
          },
          en: {
            save: "SAVE"
          },
          zh: {
            save: "保存"
          }
        }
      };
    },
    mounted() {
      this.init();
    },
    methods: {
      init() {
        let self = this;

        let options = {
          mode: this.mode,
          modes: this.modes, // allowed modes
          // theme: "bootstrap4",
          themeColor: "#007bff",
          onChange() {
            try {
              let json = self.editor.get();
              self.json = json;
              self.error = false;
              self.$emit("has-error", false);
              self.internalChange = true;
              self.$emit("input", json);
              self.$nextTick(function () {
                self.internalChange = false;
              });
            } catch (e) {
              self.error = true;
              self.$emit("has-error", true);
            }
          },
          onModeChange() {
            self.expandAll();
          }
        };
        this.editor = new JSONEditor(
          self.$el.querySelector(".jsoneditor-vue"),
          options,
          self.json
        );
      },
      expandAll() {
        if (
          this.expandedOnStart &&
          this.expandedModes.includes(this.editor.getMode())
        ) {
          this.editor.expandAll();
        }
      },

      onSave() {
        this.$emit("json-save", this.value);
      },

      async setEditor(value) {
        if (this.editor) this.editor.set(value);
      }
    }
  });
</script>

  .json-title {
    font-size: 15px; 
    font-weight: bold;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  .ace_line_group {
    text-align: left;
  }

  .jsoneditor-menu a.jsoneditor-poweredBy {
    display: none;
  }
  .jsoneditor-menu {
    background-color: #4caf50;
    border-bottom: 1px solid #4caf50;
  }
  .jsoneditor {
    border: thin solid #4caf50;
  }
</style>
