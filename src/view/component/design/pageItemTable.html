<script type="text/x-template" id="pageItemTable">
  <div class="overflow-x-auto">
    <table class="w-full" cellpadding="0" cellspacing="0">
      <tr>
        <th v-for="(header, i) in headers[type]" :key="i">{{ header.label }}</th>
        <th class="max-w-10 w-10 text-center py-2"></th>
      </tr>
      <tr v-for="(item, index) in tableData">
        <td class="px-1 py-1 max-w-[200px] min-w-[80px]" v-for="(column, i) in headers[type]" :key="i"
          @click="inputFocus({ item, column, index, type })"
          :class="{'td-validate': error[index] && error[index].includes(column.value)}"
          :style="{ width: ['resourceHook', 'resourceData', 'uiActionConfig'].includes(column.value) ? 'auto' : '' }">
          <pre class="json-view pa-2" v-if="jsonDetail && column.component === 'input' && column.dataType === 'json'">{{detailJson(item[column.value])}}</pre>
          <v-text-field 
            v-else-if="column.component === 'input'"
            v-model="item[column.value]" 
            :type="column.type"
            :class="column.value === 'pageId' ? 'disabled' : ''"
            :disabled="column.value === 'pageId' || column.dataType === 'json'" 
            class="cus-v-input mr-2" dense single-line outlined
            :label="column.label"></v-text-field>
          <v-select 
              v-if="column.component === 'select'" 
              v-model="item[column.value]"
              :items="column.options"   
              item-text="label"
              item-value="value"
              :label="column.label" 
              dense single-line outlined clearable
              hide-details="auto">
          </v-select>
          <div class="pa-2 h-8 leading-4 border border-gray-200 rounded-sm whitespace-nowrap overflow-hidden text-ellipsis text-left" v-if="column.component === 'pre'">{{item[column.value]}}</div>
        </td>
        <td class="px-1 py-1">
          <v-icon aria-hidden="false" @click="lineDel({ index })"
            color="red">
            mdi-trash-can</v-icon>
        </td>
      </tr>
      <tr v-if="tableData.length === 0">
        <td colspan="7" class="pa-4 text-center" style="height: auto;">
          <img src="../../../images/empty.png" alt="" style="width: 100px">
          <div class="mt-2"><span style="color: #999">暂无更多内容~</span></div>
        </td>
      </tr>
    </table>
    <v-dialog v-model="dialog">

    </v-dialog>
  </div>
</script>

<script>
  Vue.component("pageItemTable", {
    template: "#pageItemTable",
    mixins: [window.jianghuUiActionMixins || {}],
    data: () => {
      return {
        headers: {
          resource: [
            // { label: 'PageId', value: 'pageId', component: 'input', type: 'text' },
            { label: 'ActionId', value: 'actionId', component: 'input', type: 'text' },
            { label: 'Desc', value: 'desc', component: 'input', type: 'text' },
            {
              label: 'ResourceType', value: 'resourceType', component: 'select', options: [
                { label: 'sql', value: 'sql' },
                { label: 'service', value: 'service' },
              ]
            },
            { label: 'ResourceHook', value: 'resourceHook', component: 'pre', type: 'text', dataType: 'json' },
            { label: 'ResourceData', value: 'resourceData', component: 'pre', type: 'text', dataType: 'json' },
          ],
        },
        defaultJson: {},
        codemirrorOptions: {
          mode: 'application/json',
          theme: 'material-darker',
          indentUnit: 4,
          smartIndent: false,
          tabSize: 4,
          indentWithTabs: true,
          readOnly: true,
          height: '400px'
        },
        dialog: false,
      }
    },
    props: {
      tableData: {
        type: Array,
        default: () => {
          return []
        }
      },
      type: {
        type: String,
        default: ''
      },
      page: {
        type: String,
        default: ''
      },
      jsonDetail: {
        type: Boolean,
        default: false
      },
      error: {
        type: Object,
        default: () => {
          return {}
        }
      }
    },
    watch: {
      tableData: {
        handler: function (a) {
        },
        deep: true
      },
      error: {
        handler: function (a) {
        },
        deep: true
      }
    },
    computed: {
    },
    methods: {
      inputFocus({ item, column, index, type }) {
        if (column.component === 'pre' && column.dataType && column.dataType === 'json') {
          this.$emit('edit-json', { json: item[column.value] || {}, key: column.value, index, type });
        }
      },
      lineDel({ index }) {
        this.tableData.splice(index, 1);
      },
      detailJson(str) {
        if (str) {
          return JSON.stringify(str, null, 2);
        }
        return ''
      },
      simpleJson(str) {
        if (str) {
          return JSON.stringify(str);
        }
        return ''
      }
    }
  });
</script>
